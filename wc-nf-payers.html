<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workers' Comp &amp; No-Fault | ZK Medical Billing</title><link rel="stylesheet" href="assets/style.css"><style>.wc-tools{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.wc-tools input,.wc-tools select{padding:12px;border:1px solid #cbd9e2;border-radius:8px;font:inherit}.wc-table{overflow:auto;border:1px solid #e3ebef;border-radius:10px}.wc-table table{border-collapse:collapse;width:100%;font-size:13px}.wc-table th,.wc-table td{padding:12px;text-align:left;border-bottom:1px solid #e3ebef}.wc-table th{background:#102b46;color:white}.wc-table tr:nth-child(even){background:#f5fafb}</style></head><body><header><div class="nav wrap"><a class="brand" href="index.html">ZK Medical Billing</a><a href="index.html">Home</a></div></header><main><section class="category-hero"><div class="wrap"><h1>Workers' Compensation &amp; No-Fault</h1><p>Carisk payer list for claim submissions</p></div></section><section class="wrap section"><p>Source: supplied Carisk CSV. Automotive support is not proof of NY No-Fault eligibility. Confirm plan, state and submission requirements before billing.</p><div class="wc-tools"><input id="q" type="search" placeholder="Search payer name or ID" aria-label="Search payer"><select id="type" aria-label="Claim type"><option value="all">All records</option><option value="6">Workers' Compensation</option><option value="7">Automotive / No-Fault reference</option></select><input id="state" placeholder="State (e.g. NY)" aria-label="State filter"></div><p id="status" role="status">Loading payer list…</p><div class="wc-table"><table><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table></div><button class="btn" id="more" hidden>Show more</button></section></main><script>const $=id=>document.getElementById(id);let data=[],limit=50;function parse(s){let rows=[],row=[],v='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(!quoted&&(c===','||c==='\n')){row.push(v);v='';if(c==='\n'){rows.push(row);row=[]}}else if(c!=='\r')v+=c}if(v||row.length){row.push(v);rows.push(row)}return rows}function cell(tag,v){const e=document.createElement(tag);e.textContent=v;return e}function render(){let q=$('q').value.toLowerCase().trim(),t=$('type').value,st=$('state').value.toUpperCase().trim();let a=data.filter(r=>{let s=r[2].toUpperCase(),parts=s.split(/[^A-Z]+/),ok=!st||(s.includes('ALL STATES')?(!s.includes('EXCEPT')||!s.split('EXCEPT')[1].split(/[^A-Z]+/).includes(st)):parts.includes(st));return ok&&(r[0]+' '+r[1]).toLowerCase().includes(q)&&(t==='all'||r[Number(t)].trim().toUpperCase()==='Y')});$('rows').replaceChildren(...a.slice(0,limit).map(r=>{let tr=document.createElement('tr');r.forEach(v=>tr.append(cell('td',v)));return tr}));$('status').textContent='Showing '+Math.min(limit,a.length)+' of '+a.length+' matching records ('+data.length+' total)';$('more').hidden=limit>=a.length}fetch('carisk-payers.csv').then(r=>{if(!r.ok)throw Error();return r.text()}).then(s=>{let a=parse(s);$('head').replaceChildren(...a.shift().map(v=>cell('th',v)));data=a.filter(r=>r.length===9);render()}).catch(()=>$('status').textContent='Unable to load payer list. Please refresh.');['q','type','state'].forEach(id=>$(id).addEventListener('input',()=>{limit=50;render()}));$('more').onclick=()=>{limit+=50;render()};</script></body></html>
