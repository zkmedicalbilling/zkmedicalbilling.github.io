ed-motion:reduce){.quiz *{animation:none!important;transition:none!important}}@media print{header,#start,#group,#play,#note,#interview-study{display:none!important}.quiz{box-shadow:none}}</style></head><body><header><div class="nav wrap"><a href="index.html">ZK Medical Billing</a><a href="ar-scenarios.html">A/R Scenarios</a><button id="lang">اردو</button></div></header><main class="wrap"><section class="quiz"><h1 id="title"></h1><p id="intro"></p><select id="group"></select> <select id="difficulty" aria-label="Difficulty"><option value="advanced">Advanced challenge</option><option value="all">All levels</option><option value="basic">Foundation practice</option></select> <button class="primary" id="start"></button><div id="play" hidden><p id="score"></p><progress id="progress"></progress><h2 id="question"></h2><div id="answers"></div><p id="explain" role="status"></p><button class="primary" id="next" hidden></button></div><div id="result" role="status"></div><section id="interview-study"><h2>Common Interview Questions / عام انٹرویو سوالات</h2><div id="study-list"></div></section><p id="note"></p><p><a href="https://www.arlearningonline.com/p/quiz.html" target="_blank" rel="noopener">Additional practice: AR Learning Online — Scenario Based Quiz</a></p></section></main><script>const bank=[{"g":"Scenario","v":["Claim not on file","پیئر کے پاس کلیم نہیں","Payer cannot locate the claim. What should you check first?","پیئر کو کلیم نہیں ملا۔ پہلے کیا چیک کریں؟","Clearinghouse and payer acceptance reports","کلیئرنگ ہاؤس اور پیئر کی قبولیت کی رپورٹس","Verify receipt before deciding whether to resubmit.","دوبارہ بھیجنے سے پہلے وصولی کی تصدیق کریں۔"]},{"g":"Scenario","v":["Claim in process","کلیم زیر کارروائی","An accepted claim is pending. What is the best next step?","قبول شدہ کلیم زیر کارروائی ہے۔ اگلا قدم؟","Confirm pending reason and expected completion","تاخیر کی وجہ اور متوقع تکمیل معلوم کریں","Avoid duplicate submissions while processing.","پروسیسنگ کے دوران ڈپلیکیٹ کلیم نہ بھیجیں۔"]},{"g":"Scenario","v":["Approved to pay","ادائیگی منظور","A claim is approved but no EFT has arrived. What should you verify?","ادائیگی منظور ہے مگر EFT نہیں آیا۔ کیا چیک کریں؟","Payment release date and remittance","ادائیگی جاری ہونے کی تاریخ اور ریمیٹنس","Approval alone is not proof of payment.","منظوری ادائیگی کا ثبوت نہیں۔"]},{"g":"Scenario","v":["Claim paid","کلیم ادا ہوا","Payer says paid but ledger is open. What is needed?","پیئر کے مطابق ادائیگی ہوئی مگر لیجر کھلا ہے۔ کیا چاہیے؟","ERA/EOB and payment trace","ERA/EOB اور ادائیگی کا ٹریس","Reconcile actual payment before posting.","پوسٹنگ سے پہلے اصل ادائیگی ملائیں۔"]},{"g":"Scenario","v":["Offset","آف سیٹ","Payment was applied to an offset. What should you obtain?","ادائیگی آف سیٹ میں لگی۔ کیا حاصل کریں؟","Offset reference and original overpayment details","آف سیٹ ریفرنس اور اصل زائد ادائیگی کی تفصیل","Reconcile both accounts to avoid double recovery.","دوہری وصولی سے بچنے کے لیے دونوں اکاؤنٹس ملائیں۔"]},{"g":"Scenario","v":["Paid to patient","مریض کو ادائیگی","Payment went to the member. What should you verify?","ادائیگی ممبر کو ہوئی۔ کیا چیک کریں؟","Payee, assignment of benefits and contract","وصول کنندہ، بینیفٹ اسائنمنٹ اور معاہدہ","Request reissue only when supported.","صرف جائز صورت میں دوبارہ ادائیگی مانگیں۔"]},{"g":"Scenario","v":["Deductible","ڈیڈکٹبل","Allowed amount is assigned to deductible. What comes next?","رقم ڈیڈکٹبل میں گئی۔ اگلا قدم؟","Verify EOB and secondary coverage","EOB اور سیکنڈری کوریج چیک کریں","Bill only validated patient liability.","صرف تصدیق شدہ مریض ذمہ داری بل کریں۔"]},{"g":"Scenario","v":["Patient not identified","مریض کی شناخت نہیں","Member cannot be identified. What should be checked?","ممبر کی شناخت نہیں ہوئی۔ کیا چیک کریں؟","Member ID, demographics and payer","ممبر ID، ذاتی معلومات اور پیئر","Correct only verified information.","صرف تصدیق شدہ معلومات درست کریں۔"]},{"g":"Scenario","v":["Coverage terminated","کوریج ختم","Coverage is terminated. What matters most?","کوریج ختم ہے۔ سب سے اہم کیا ہے؟","Coverage effective dates on DOS","DOS پر کوریج کی مؤثر تاریخیں","Current eligibility alone does not establish past coverage.","موجودہ اہلیت سابقہ کوریج کا ثبوت نہیں۔"]},{"g":"Scenario","v":["TFL expired","ٹائملی فائلنگ ختم","Payer denies timely filing. What supports an appeal?","ٹائملی فائلنگ ڈینائل میں اپیل کا ثبوت؟","Accepted timely receipt or valid exception","وقت پر قبول شدہ رسید یا جائز استثنا","Check plan-specific deadlines.","پلان کی مخصوص آخری تاریخ چیک کریں۔"]},{"g":"Scenario","v":["Authorization missing","اتھارائزیشن غائب","Authorization denial arrives. What should be compared?","اتھارائزیشن ڈینائل میں کیا ملائیں؟","Approval dates, service, units and provider","منظوری کی تاریخ، سروس، یونٹس اور پرووائیڈر","Correct supported mismatches only.","صرف ثابت شدہ فرق درست کریں۔"]},{"g":"Scenario","v":["Referral missing","ریفرل غائب","Referral is missing. What is appropriate?","ریفرل غائب ہے۔ مناسب کارروائی؟","Verify referral requirement and existing referral","ریفرل کی شرط اور موجودہ ریفرل چیک کریں","Never fabricate a referral.","جعلی ریفرل نہ بنائیں۔"]},{"g":"Scenario","v":["Maximum benefit","بینیفٹ کی حد","Benefit exhausted denial arrives. What should you review?","بینیفٹ ختم ہونے پر کیا دیکھیں؟","Benefit period, utilization and secondary coverage","بینیفٹ مدت، استعمال اور سیکنڈری کوریج","Dispute incorrect utilization with evidence.","غلط استعمال کے حساب پر ثبوت سے اعتراض کریں۔"]},{"g":"Scenario","v":["Noncovered charges","نان کورڈ چارجز","A service is excluded. What should you review?","سروس خارج ہے۔ کیا دیکھیں؟","Plan exclusion and applicable billing protections","پلان کی شرط اور بلنگ تحفظات","A denial does not automatically establish patient liability.","ڈینائل خودکار مریض ذمہ داری نہیں۔"]},{"g":"Scenario","v":["Out of network","آؤٹ آف نیٹ ورک","OON denial arrives. What is the first review?","OON ڈینائل میں پہلے کیا دیکھیں؟","Network status on DOS and plan exceptions","DOS پر نیٹ ورک اور پلان کے استثنا","Check balance billing protections.","بیلنس بلنگ تحفظات چیک کریں۔"]},{"g":"Scenario","v":["Patient information requested","مریض سے معلومات مطلوب","Payer requests member information. What should you do?","پیئر ممبر کی معلومات مانگتا ہے۔ کیا کریں؟","Confirm exact request and contact member securely","اصل درخواست معلوم کرکے محفوظ رابطہ کریں","Do not invent member responses.","ممبر کا جواب خود نہ بنائیں۔"]},{"g":"Scenario","v":["Global surgery","گلوبل سرجری","Service denied as globally inclusive. What is needed?","گلوبل سرجری ڈینائل میں کیا چاہیے؟","Global period and documented service relationship","گلوبل مدت اور سروس کا دستاویزی تعلق","Use a modifier only if supported.","صرف جائز موڈیفائر لگائیں۔"]},{"g":"Scenario","v":["Hospice","ہاسپس","Patient is enrolled in hospice. What should you verify?","مریض ہاسپس میں ہے۔ کیا چیک کریں؟","Election dates and relationship to terminal condition","داخلے کی تاریخ اور آخری بیماری سے تعلق","Determine correct payment responsibility.","درست ادائیگی کی ذمہ داری معلوم کریں۔"]},{"g":"Scenario","v":["Primary paid more","پرائمری نے زیادہ ادا کیا","Primary paid more than secondary allowed. What should you review?","پرائمری ادائیگی سیکنڈری allowed سے زیادہ ہے۔ کیا دیکھیں؟","Secondary COB calculation and EOB","سیکنڈری COB حساب اور EOB","No additional payment may be due.","مزید ادائیگی ضروری نہیں ہو سکتی۔"]},{"g":"Scenario","v":["Duplicate service","ڈپلیکیٹ سروس","Duplicate denial arrives. What is the first action?","ڈپلیکیٹ ڈینائل میں پہلا قدم؟","Locate and compare original claim","اصل کلیم تلاش کرکے ملائیں","Do not repeatedly submit true duplicates.","حقیقی ڈپلیکیٹ بار بار نہ بھیجیں۔"]},{"g":"Scenario","v":["Capitation","کیپیٹیشن","Service denied under capitation. What should you verify?","کیپیٹیشن ڈینائل میں کیا چیک کریں؟","Contract, assigned provider and carve-outs","معاہدہ، مقررہ پرووائیڈر اور استثنا","Separate billing depends on contract terms.","الگ بلنگ معاہدے پر منحصر ہے۔"]},{"g":"Modifier","v":["Modifier 25","موڈیفائر 25","Which code receives modifier 25 for a supported separate same-day E/M?","الگ جائز اسی دن E/M میں 25 کس کوڈ پر لگتا ہے؟","E/M code","E/M کوڈ","Document work beyond the procedure.","پروسیجر سے اضافی کام درج کریں۔"]},{"g":"Modifier","v":["Modifier 59","موڈیفائر 59","When is modifier 59 appropriate?","موڈیفائر 59 کب مناسب ہے؟","Documented distinct service when permitted","دستاویزی الگ سروس جب اجازت ہو","It is not an automatic bundling bypass.","یہ بنڈلنگ سے بچنے کا خودکار طریقہ نہیں۔"]},{"g":"Interview","v":["Interview practice","انٹرویو پریکٹس","What belongs in a professional AR follow-up note?","پروفیشنل اے آر نوٹ میں کیا ہونا چاہیے؟","Verified status, action, reference and next follow-up","تصدیق شدہ حیثیت، کارروائی، ریفرنس اور اگلا فالو اپ","Document actual findings, not assumptions.","اصل معلومات لکھیں، مفروضے نہیں۔"]},{"g":"General","v":["CPT guidelines","CPT اصول","Which code set date should be checked?","کوڈ سیٹ کی کون سی تاریخ چیک کریں؟","Effective code set for DOS","DOS پر مؤثر کوڈ سیٹ","Code validity depends on service date.","کوڈ کی درستگی سروس تاریخ پر منحصر ہے۔"]},{"g":"General","v":["Frequency rules","فریکوئنسی اصول","A frequency limit denial arrives. What should you check?","فریکوئنسی ڈینائل میں کیا دیکھیں؟","Policy period and prior utilization","پالیسی مدت اور سابقہ استعمال","Limits differ by service and payer.","حدود سروس اور پیئر کے مطابق بدلتی ہیں۔"]},{"g":"General","v":["Hospital billing","ہسپتال بلنگ","Which form is generally used for institutional paper claims?","ادارہ جاتی کاغذی کلیم کا فارم کون سا ہے؟","UB-04 / CMS-1450","UB-04 / CMS-1450","CMS-1500 is generally professional billing.","CMS-1500 عموماً پروفیشنل بلنگ ہے۔"]},{"g":"General","v":["AR aging","اے آر ایجنگ","Which factors help prioritize AR accounts?","اے آر اکاؤنٹس کی ترجیح کیسے مقرر کریں؟","Deadlines, aging and balance","آخری تاریخیں، ایجنگ اور بیلنس","Protect filing and appeal deadlines.","فائلنگ اور اپیل کی آخری تاریخ محفوظ رکھیں۔"]},{"g":"Interview","v":["RCM","RCM","What is Revenue Cycle Management?","ریونیو سائیکل مینجمنٹ کیا ہے؟","The financial workflow from registration through final account resolution.","رجسٹریشن سے اکاؤنٹ کے حتمی حل تک مالیاتی عمل۔","The financial workflow from registration through final account resolution.","رجسٹریشن سے اکاؤنٹ کے حتمی حل تک مالیاتی عمل۔"],"wrong":["Only payment posting","Only coding","Only eligibility"]},{"g":"Interview","v":["A/R","A/R","What is accounts receivable?","اکاؤنٹس ریسیویبل کیا ہے؟","Outstanding amounts owed for services provided.","فراہم کردہ خدمات کی واجب الوصول رقم۔","Outstanding amounts owed for services provided.","فراہم کردہ خدمات کی واجب الوصول رقم۔"],"wrong":["Total contractual adjustments","Total deposits","Total submitted charges regardless of payment"]},{"g":"Interview","v":["EOB","EOB","What is an EOB?","EOB کیا ہے؟","An explanation of how a payer processed a claim.","پیئر نے کلیم کیسے پراسیس کیا اس کی وضاحت۔","An explanation of how a payer processed a claim.","پیئر نے کلیم کیسے پراسیس کیا اس کی وضاحت۔"],"wrong":["A prior authorization","A claim submission form","A provider contract"]},{"g":"Interview","v":["ERA","ERA","Which transaction is an electronic remittance advice?","الیکٹرانک ریمیٹنس کا ٹرانزیکشن کون سا ہے؟","835","835","835","835"],"wrong":["837","270","276"]},{"g":"Interview","v":["EDI","EDI","Which transaction submits professional claims?","پروفیشنل کلیم کس ٹرانزیکشن سے بھیجا جاتا ہے؟","837P","837P","837P","837P"],"wrong":["835","271","277"]},{"g":"Interview","v":["Eligibility","Eligibility","Which transaction requests eligibility information?","اہلیت کی معلومات کی درخواست کا ٹرانزیکشن کون سا ہے؟","270","270","270","270"],"wrong":["271","835","837"]},{"g":"Interview","v":["Claim status","Claim status","Which transaction requests claim status?","کلیم اسٹیٹس کی درخواست کا ٹرانزیکشن کون سا ہے؟","276","276","276","276"],"wrong":["277","835","999"]},{"g":"Interview","v":["COB","COB","What is coordination of benefits?","COB کیا ہے؟","Determining payment order and responsibility when multiple coverages itting a claim.","کلیم جمع کرانے کی قابل اطلاق آخری تاریخ۔"],"wrong":["Payment release date","Authorization expiry only","Patient statement date"]},{"g":"Interview","v":["CARC","CARC","What does CARC explain?","CARC کیا بتاتا ہے؟","The reason for a claim adjustment.","کلیم ایڈجسٹمنٹ کی وجہ۔","The reason for a claim adjustment.","کلیم ایڈجسٹمنٹ کی وجہ۔"],"wrong":["Provider specialty","Patient diagnosis","Claim submission format"]},{"g":"Interview","v":["RAR C","RAR C","What does RARC provide?","RARC کیا بتاتا ہے؟","Additional remittance explanation or informational detail.","ریمیٹنس کی اضافی وضاحت یا معلومات۔","Additional remittance explanation or informational detail.","ریمیٹنس کی اضافی وضاحت یا معلومات۔"],"wrong":["A procedure code","A member ID","A payment trace number"]},{"g":"Interview","v":["NPI","NPI","How many digits are in an NPI?","NPI میں کتنے ہندسے ہیں؟","10","10","10","10"],"wrong":["9","12","15"]},{"g":"Interview","v":["CMS-1500","CMS-1500","Which paper form is generally used for professional claims?","پروفیشنل کلیم کا کاغذی فارم کون سا ہے؟","CMS-1500","CMS-1500","CMS-1500","CMS-1500"],"wrong":["UB-04","CMS-855","CMS-1490S"]},{"g":"Interview","v":["HIPAA","HIPAA","How should patient information be handled during follow-up?","فالو اپ میں مریض کی معلومات کیسے استعمال کریں؟","Use authorized secure channels and applicable privacy safeguards.","مجاز محفوظ ذرائع اور رازداری کے اصول استعمال کریں۔","Use authorized secure channels and applicable privacy safeguards.","مجاز محفوظ ذرائع اور رازداری کے اصول استعمال کریں۔"],"wrong":["Use public messaging","Share full records with any caller","Post identifiers in public notes"]},{"g":"Interview","v":["Appeal","Appeal","What supports a medical necessity appeal?","طبی ضرورت کی اپیل میں کیا مدد کرتا ہے؟","Relevant clinical documentation and applicable coverage criteria.","متعلقہ طبی دستاویزات اور کوریج کے اصول۔","Relevant clinical documentation and applicable coverage criteria.","متعلقہ طبی دستاویزات اور کوریج کے اصول۔"] nderpayment","Underpayment","Contract allowed $160, deductible $40, coinsurance 20% of the remaining allowed amount. Payer paid $80. Assuming no other adjustments, what is the underpayment?","معاہدے کے مطابق allowed $160، deductible $40 اور باقی پر 20% coinsurance ہے۔ پیئر نے $80 ادا کیے۔ دیگر ایڈجسٹمنٹ نہیں۔ کم ادائیگی کتنی ہے؟","$16","$16","Expected payment = ($160 − $40) × 80% = $96; difference = $16.","متوقع ادائیگی $96 ہے؛ فرق $16 ہے۔"],"wrong":[["$24","$24"],["$40","$40"],["$48","$48"]]},{"g":"Scenario","advanced":true,"v":["COB","COB","Primary allowed $120 and paid $90. Secondary allowed $100 and uses a stipulated nonduplication method: secondary allowed minus primary payment, capped at remaining patient liability. Primary PR is $30. What is secondary payment?","پرائمری allowed $120 اور ادائیگی $90 ہے۔ سیکنڈری allowed $100 ہے اور اس کے مقررہ nonduplication اصول کے مطابق پرائمری ادائیگی منہا ہوتی ہے، PR کی حد تک۔ PR $30 ہے۔ سیکنڈری ادائیگی؟","$10","$10","Under the stated method, $100 − $90 = $10, below the $30 liability cap.","دیے گئے اصول کے مطابق $100 میں سے $90 منہا کرنے پر $10 بنتے ہیں۔"],"wrong":[["$30","$30"],["$20","$20"],["$0","$0"]]},{"g":"Modifier","advanced":true,"v":["Global surgery","Global surgery","During a 90-day postoperative period, the same surgeon evaluates a new unrelated condition in a separately documented office visit. Which modifier is appropriate on the E/M, assuming payer rules are met?","90 دن کے گلوبل پیریڈ میں وہی سرجن نئی غیر متعلقہ بیماری کا الگ معائنہ کرتا ہے۔ پیئر کے قواعد پورے ہوں تو E/M پر کون سا موڈیفائر؟","24","24","Modifier 24 identifies unrelated postoperative E/M; 79 is for an unrelated procedure.","24 غیر متعلقہ postoperative E/M کے لیے ہے؛ 79 غیر متعلقہ پروسیجر کے لیے ہے۔"],"wrong":[["25","25"],["57","57"],["79","79"]]},{"g":"Scenario","advanced":true,"v":["Authorization mismatch","Authorization mismatch","Authorization covers 6 visits through June 30. The seventh visit on June 28 is denied. What should be investigate
