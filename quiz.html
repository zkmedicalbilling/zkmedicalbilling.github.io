<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR Quiz | ZK Medical Billing</title><link rel="stylesheet" href="assets/style.css"><style>.quiz{max-width:780px;margin:28px auto;padding:24px;border:1px solid #dce8ed;border-radius:20px;background:white;box-shadow:0 8px 30px #102b4610}.quiz button,.quiz select{font:inherit;padding:12px;border:1px solid #cbd9e2;border-radius:10px;background:white;color:#102b46;cursor:pointer}.quiz .primary{background:#102b46;color:white}.quiz .answer{display:block;width:100%;text-align:start;margin:10px 0}.quiz .correct{background:#e0f6e8;border-color:#23864d}.quiz .wrong{background:#fde7e7;border-color:#bd4141}.quiz progress{width:100%;accent-color:#13a89e}.quiz h2{margin:18px 0}.quiz button:disabled{cursor:default}.quiz [hidden]{display:none!important}</style></head><body><header><div class="nav wrap"><a href="index.html">ZK Medical Billing</a><a href="ar-scenarios.html">A/R Scenarios</a><button id="lang">اردو</button></div></header><main class="wrap"><section class="quiz"><h1 id="title"></h1><p id="intro"></p><select id="group"></select> <button class="primary" id="start"></button><div id="play" hidden><p id="score"></p><progress id="progress"></progress><h2 id="question"></h2><div id="answers"></div><p id="explain" role="status"></p><button class="primary" id="next" hidden></button></div><div id="result" role="status"></div><p id="note"></p><p><a href="https://www.arlearningonline.com/p/quiz.html" target="_blank" rel="noopener">Additional practice: AR Learning Online — Scenario Based Quiz</a></p></section></main><script>const bank=[{"g":"Scenario","v":["Claim not on file","پیئر کے پاس کلیم نہیں","Payer cannot locate the claim. What should you check first?","پیئر کو کلیم نہیں ملا۔ پہلے کیا چیک کریں؟","Clearinghouse and payer acceptance reports","کلیئرنگ ہاؤس اور پیئر کی قبولیت کی رپورٹس","Verify receipt before deciding whether to resubmit.","دوبارہ بھیجنے سے پہلے وصولی کی تصدیق کریں۔"]},{"g":"Scenario","v":["Claim in process","کلیم زیر کارروائی","An accepted claim is pending. What is the best next step?","قبول شدہ کلیم زیر کارروائی ہے۔ اگلا قدم؟","Confirm pending reason and expected completion","تاخیر کی وجہ اور متوقع تکمیل معلوم کریں","Avoid duplicate submissions while processing.","پروسیسنگ کے دوران ڈپلیکیٹ کلیم نہ بھیجیں۔"]},{"g":"Scenario","v":["Approved to pay","ادائیگی منظور","A claim is approved but no EFT has arrived. What should you verify?","ادائیگی منظور ہے مگر EFT نہیں آیا۔ کیا چیک کریں؟","Payment release date and remittance","ادائیگی جاری ہونے کی تاریخ اور ریمیٹنس","Approval alone is not proof of payment.","منظوری ادائیگی کا ثبوت نہیں۔"]},{"g":"Scenario","v":["Claim paid","کلیم ادا ہوا","Payer says paid but ledger is open. What is needed?","پیئر کے مطابق ادائیگی ہوئی مگر لیجر کھلا ہے۔ کیا چاہیے؟","ERA/EOB and payment trace","ERA/EOB اور ادائیگی کا ٹریس","Reconcile actual payment before posting.","پوسٹنگ سے پہلے اصل ادائیگی ملائیں۔"]},{"g":"Scenario","v":["Offset","آف سیٹ","Payment was applied to an offset. What should you obtain?","ادائیگی آف سیٹ میں لگی۔ کیا حاصل کریں؟","Offset reference and original overpayment details","آف سیٹ ریفرنس اور اصل زائد ادائیگی کی تفصیل","Reconcile both accounts to avoid double recovery.","دوہری وصولی سے بچنے کے لیے دونوں اکاؤنٹس ملائیں۔"]},{"g":"Scenario","v":["Paid to patient","مریض کو ادائیگی","Payment went to the member. What should you verify?","ادائیگی ممبر کو ہوئی۔ کیا چیک کریں؟","Payee, assignment of benefits and contract","وصول کنندہ، بینیفٹ اسائنمنٹ اور معاہدہ","Request reissue only when supported.","صرف جائز صورت میں دوبارہ ادائیگی مانگیں۔"]},{"g":"Scenario","v":["Deductible","ڈیڈکٹبل","Allowed amount is assigned to deductible. What comes next?","رقم ڈیڈکٹبل میں گئی۔ اگلا قدم؟","Verify EOB and secondary coverage","EOB اور سیکنڈری کوریج چیک کریں","Bill only validated patient liability.","صرف تصدیق شدہ مریض ذمہ داری بل کریں۔"]},{"g":"Scenario","v":["Patient not identified","مریض کی شناخت نہیں","Member cannot be identified. What should be checked?","ممبر کی شناخت نہیں ہوئی۔ کیا چیک کریں؟","Member ID, demographics and payer","ممبر ID، ذاتی معلومات اور پیئر","Correct only verified information.","صرف تصدیق شدہ معلومات درست کریں۔"]},{"g":"Scenario","v":["Coverage terminated","کوریج ختم","Coverage is terminated. What matters most?","کوریج ختم ہے۔ سب سے اہم کیا ہے؟","Coverage effective dates on DOS","DOS پر کوریج کی مؤثر تاریخیں","Current eligibility alone does not establish past coverage.","موجودہ اہلیت سابقہ کوریج کا ثبوت نہیں۔"]},{"g":"Scenario","v":["TFL expired","ٹائملی فائلنگ ختم","Payer denies timely filing. What supports an appeal?","ٹائملی فائلنگ ڈینائل میں اپیل کا ثبوت؟","Accepted timely receipt or valid exception","وقت پر قبول شدہ رسید یا جائز استثنا","Check plan-specific deadlines.","پلان کی مخصوص آخری تاریخ چیک کریں۔"]},{"g":"Scenario","v":["Authorization missing","اتھارائزیشن غائب","Authorization denial arrives. What should be compared?","اتھارائزیشن ڈینائل میں کیا ملائیں؟","Approval dates, service, units and provider","منظوری کی تاریخ، سروس، یونٹس اور پرووائیڈر","Correct supported mismatches only.","صرف ثابت شدہ فرق درست کریں۔"]},{"g":"Scenario","v":["Referral missing","ریفرل غائب","Referral is missing. What is appropriate?","ریفرل غائب ہے۔ مناسب کارروائی؟","Verify referral requirement and existing referral","ریفرل کی شرط اور موجودہ ریفرل چیک کریں","Never fabricate a referral.","جعلی ریفرل نہ بنائیں۔"]},{"g":"Scenario","v":["Maximum benefit","بینیفٹ کی حد","Benefit exhausted denial arrives. What should you review?","بینیفٹ ختم ہونے پر کیا دیکھیں؟","Benefit period, utilization and secondary coverage","بینیفٹ مدت، استعمال اور سیکنڈری کوریج","Dispute incorrect utilization with evidence.","غلط استعمال کے حساب پر ثبوت سے اعتراض کریں۔"]},{"g":"Scenario","v":["Noncovered charges","نان کورڈ چارجز","A service is excluded. What should you review?","سروس خارج ہے۔ کیا دیکھیں؟","Plan exclusion and applicable billing protections","پلان کی شرط اور بلنگ تحفظات","A denial does not automatically establish patient liability.","ڈینائل خودکار مریض ذمہ داری نہیں۔"]},{"g":"Scenario","v":["Out of network","آؤٹ آف نیٹ ورک","OON denial arrives. What is the first review?","OON ڈینائل میں پہلے کیا دیکھیں؟","Network status on DOS and plan exceptions","DOS پر نیٹ ورک اور پلان کے استثنا","Check balance billing protections.","بیلنس بلنگ تحفظات چیک کریں۔"]},{"g":"Scenario","v":["Patient information requested","مریض سے معلومات مطلوب","Payer requests member information. What should you do?","پیئر ممبر کی معلومات مانگتا ہے۔ کیا کریں؟","Confirm exact request and contact member securely","اصل درخواست معلوم کرکے محفوظ رابطہ کریں","Do not invent member responses.","ممبر کا جواب خود نہ بنائیں۔"]},{"g":"Scenario","v":["Global surgery","گلوبل سرجری","Service denied as globally inclusive. What is needed?","گلوبل سرجری ڈینائل میں کیا چاہیے؟","Global period and documented service relationship","گلوبل مدت اور سروس کا دستاویزی تعلق","Use a modifier only if supported.","صرف جائز موڈیفائر لگائیں۔"]},{"g":"Scenario","v":["Hospice","ہاسپس","Patient is enrolled in hospice. What should you verify?","مریض ہاسپس میں ہے۔ کیا چیک کریں؟","Election dates and relationship to terminal condition","داخلے کی تاریخ اور آخری بیماری سے تعلق","Determine correct payment responsibility.","درست ادائیگی کی ذمہ داری معلوم کریں۔"]},{"g":"Scenario","v":["Primary paid more","پرائمری نے زیادہ ادا کیا","Primary paid more than secondary allowed. What should you review?","پرائمری ادائیگی سیکنڈری allowed سے زیادہ ہے۔ کیا دیکھیں؟","Secondary COB calculation and EOB","سیکنڈری COB حساب اور EOB","No additional payment may be due.","مزید ادائیگی ضروری نہیں ہو سکتی۔"]},{"g":"Scenario","v":["Duplicate service","ڈپلیکیٹ سروس","Duplicate denial arrives. What is the first action?","ڈپلیکیٹ ڈینائل میں پہلا قدم؟","Locate and compare original claim","اصل کلیم تلاش کرکے ملائیں","Do not repeatedly submit true duplicates.","حقیقی ڈپلیکیٹ بار بار نہ بھیجیں۔"]},{"g":"Scenario","v":["Capitation","کیپیٹیشن","Service denied under capitation. What should you verify?","کیپیٹیشن ڈینائل میں کیا چیک کریں؟","Contract, assigned provider and carve-outs","معاہدہ، مقررہ پرووائیڈر اور استثنا","Separate billing depends on contract terms.","الگ بلنگ معاہدے پر منحصر ہے۔"]},{"g":"Modifier","v":["Modifier 25","موڈیفائر 25","Which code receives modifier 25 for a supported separate same-day E/M?","الگ جائز اسی دن E/M میں 25 کس کوڈ پر لگتا ہے؟","E/M code","E/M کوڈ","Document work beyond the procedure.","پروسیجر سے اضافی کام درج کریں۔"]},{"g":"Modifier","v":["Modifier 59","موڈیفائر 59","When is modifier 59 appropriate?","موڈیفائر 59 کب مناسب ہے؟","Documented distinct service when permitted","دستاویزی الگ سروس جب اجازت ہو","It is not an automatic bundling bypass.","یہ بنڈلنگ سے بچنے کا خودکار طریقہ نہیں۔"]},{"g":"Interview","v":["Interview practice","انٹرویو پریکٹس","What belongs in a professional AR follow-up note?","پروفیشنل اے آر نوٹ میں کیا ہونا چاہیے؟","Verified status, action, reference and next follow-up","تصدیق شدہ حیثیت، کارروائی، ریفرنس اور اگلا فالو اپ","Document actual findings, not assumptions.","اصل معلومات لکھیں، مفروضے نہیں۔"]},{"g":"General","v":["CPT guidelines","CPT اصول","Which code set date should be checked?","کوڈ سیٹ کی کون سی تاریخ چیک کریں؟","Effective code set for DOS","DOS پر مؤثر کوڈ سیٹ","Code validity depends on service date.","کوڈ کی درستگی سروس تاریخ پر منحصر ہے۔"]},{"g":"General","v":["Frequency rules","فریکوئنسی اصول","A frequency limit denial arrives. What should you check?","فریکوئنسی ڈینائل میں کیا دیکھیں؟","Policy period and prior utilization","پالیسی مدت اور سابقہ استعمال","Limits differ by service and payer.","حدود سروس اور پیئر کے مطابق بدلتی ہیں۔"]},{"g":"General","v":["Hospital billing","ہسپتال بلنگ","Which form is generally used for institutional paper claims?","ادارہ جاتی کاغذی کلیم کا فارم کون سا ہے؟","UB-04 / CMS-1450","UB-04 / CMS-1450","CMS-1500 is generally professional billing.","CMS-1500 عموماً پروفیشنل بلنگ ہے۔"]},{"g":"General","v":["AR aging","اے آر ایجنگ","Which factors help prioritize AR accounts?","اے آر اکاؤنٹس کی ترجیح کیسے مقرر کریں؟","Deadlines, aging and balance","آخری تاریخیں، ایجنگ اور بیلنس","Protect filing and appeal deadlines.","فائلنگ اور اپیل کی آخری تاریخ محفوظ رکھیں۔"]}];let ur=localStorage.getItem('zk-language')==='ur',list=[],i=0,score=0,chosen=null,opts=[];const $=id=>document.getElementById(id),tr=(a,b)=>ur?b:a,shuffle=a=>{a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a};function ui(){document.documentElement.lang=ur?'ur':'en';document.documentElement.dir=ur?'rtl':'ltr';$('lang').textContent=ur?'English':'اردو';$('title').textContent=tr('A/R Quiz & Interview Practice','اے آر کوئز اور انٹرویو پریکٹس');$('intro').textContent=tr('Test your knowledge with '+bank.length+' original practice questions.','اپنی معلومات '+bank.length+' اصل پریکٹس سوالات سے آزمائیں۔');let g=$('group').value;$('group').innerHTML=['All','Scenario','Modifier','Interview','General'].map((x,j)=>'<option value="'+x+'">'+tr(x,['تمام','کیسز','موڈیفائر','انٹرویو','عمومی'][j])+'</option>').join('');$('group').value=g||'All';$('start').textContent=tr('Start / restart quiz','کوئز شروع کریں');$('next').textContent=tr('Next question','اگلا سوال');$('note').textContent=tr('Educational practice only. Verify payer-specific policies. Questions are original, not copied from the linked site.','صرف تعلیمی پریکٹس۔ پیئر کی پالیسی چیک کریں۔ سوالات اصل ہیں، لنک سے نقل نہیں کیے گئے۔');if(list.length&&i<list.length)render();else if(list.length)finish()}function render(){let v=list[i].v;$('score').textContent=tr('Question ','سوال ')+(i+1)+' / '+list.length+' · '+tr('Score ','اسکور ')+score;$('progress').max=list.length;$('progress').value=i+(chosen!==null?1:0);$('question').textContent=v[ur?3:2];$('answers').replaceChildren();opts.forEach(o=>{let b=document.createElement('button');b.className='answer';b.textContent=o[ur?1:0];b.disabled=chosen!==null;if(chosen!==null){if(o[2])b.classList.add('correct');else if(o===chosen)b.classList.add('wrong')}b.onclick=()=>{chosen=o;if(o[2])score++;render()};$('answers').append(b)});$('explain').textContent=chosen===null?'':(chosen[2]?tr('Correct! ','درست! '):tr('Incorrect. ','غلط۔ '))+v[ur?7:6];$('next').hidden=chosen===null}function prepare(){chosen=null;let v=list[i].v;opts=shuffle([[v[4],v[5],true],['Immediately write off the balance without review','بغیر جائزے کے رقم ختم کریں',false],['Change claim details without documentation','بغیر دستاویزات کلیم بدلیں',false],['Ignore payer requirements and close the account','پیئر قواعد نظر انداز کرکے اکاؤنٹ بند کریں',false]]);render()}function finish(){$('play').hidden=true;$('result').textContent=tr('Final score: ','حتمی اسکور: ')+score+'/'+list.length+' ('+Math.round(score/list.length*100)+'%)'}$('start').onclick=()=>{list=shuffle(bank.filter(x=>$('group').value==='All'||x.g===$('group').value));i=score=0;$('result').textContent='';$('play').hidden=false;prepare()};$('next').onclick=()=>{if(++i===list.length)finish();else prepare()};$('lang').onclick=()=>{ur=!ur;localStorage.setItem('zk-language',ur?'ur':'en');ui()};ui();</script><script src="assets/feedback.js" defer></script></body></html>
